<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Cloud - 10 TB Lifetime Storage</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg: #070b19;
      --card-bg: rgba(15, 23, 42, 0.75);
      --card-border: rgba(56, 189, 248, 0.2);
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --purple-glow: rgba(168, 85, 247, 0.3);
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; position: relative; }

    .glow-orb-1, .glow-orb-2 {
      position: fixed; border-radius: 50%; filter: blur(120px); pointer-events: none; z-index: 0;
      animation: floatOrb 18s ease-in-out infinite alternate;
    }
    .glow-orb-1 { width: 450px; height: 450px; background: var(--accent-glow); top: -100px; left: -100px; }
    .glow-orb-2 { width: 550px; height: 550px; background: var(--purple-glow); bottom: -150px; right: -150px; }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(60px, 80px) scale(1.1); }
    }

    #particleCanvas { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
    .app-container { position: relative; z-index: 2; max-width: 1100px; margin: 0 auto; padding: 25px 20px; }

    .header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;
      background: var(--card-bg); backdrop-filter: blur(16px);
      padding: 16px 24px; border-radius: 18px; border: 1px solid var(--card-border);
      flex-wrap: wrap; gap: 15px;
    }
    .brand { font-size: 22px; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 10px; }
    .brand i { color: var(--accent); filter: drop-shadow(0 0 10px var(--accent)); }
    .search-box {
      background: rgba(11, 19, 43, 0.7); border: 1px solid var(--card-border); border-radius: 25px;
      padding: 8px 16px; display: flex; align-items: center; gap: 10px; width: 280px;
    }
    .search-box input { background: transparent; border: none; color: #fff; outline: none; width: 100%; font-size: 13px; }

    .storage-banner {
      background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px;
      padding: 16px 20px; margin-bottom: 25px; backdrop-filter: blur(12px);
    }
    .storage-header { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px; font-weight: 600; }
    .storage-bar-bg { width: 100%; height: 8px; background: rgba(255, 255, 255, 0.08); border-radius: 10px; overflow: hidden; }
    .storage-bar-fill { width: 0.1%; height: 100%; background: linear-gradient(90deg, #38bdf8, #a855f7); border-radius: 10px; transition: width 0.3s; }

    .upload-zone {
      background: var(--card-bg); backdrop-filter: blur(16px); border-radius: 20px;
      border: 2px dashed var(--card-border); padding: 35px 25px; text-align: center;
      cursor: pointer; transition: 0.3s; position: relative; margin-bottom: 25px;
    }
    .upload-zone:hover { border-color: var(--accent); box-shadow: 0 0 30px var(--accent-glow); }
    .upload-zone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .upload-icon { font-size: 45px; color: var(--accent); margin-bottom: 10px; animation: bounce 2s infinite ease-in-out; }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }

    .progress-box { display: none; margin-top: 15px; }
    .progress-bar-bg { width: 100%; height: 8px; background: rgba(255, 255, 255, 0.08); border-radius: 10px; overflow: hidden; }
    .progress-bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #38bdf8, #a855f7); transition: width 0.2s; }
    .progress-text { font-size: 12px; color: var(--accent); margin-top: 6px; font-weight: 600; }

    .notice-bar {
      background: rgba(234, 179, 8, 0.08); border: 1px solid rgba(234, 179, 8, 0.25);
      border-radius: 12px; padding: 12px 18px; font-size: 12px; color: #fde047;
      display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 25px;
    }
    .notice-bar button {
      background: rgba(234, 179, 8, 0.2); border: 1px solid rgba(234, 179, 8, 0.4);
      color: #fef08a; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 11px;
    }

    .section-title { font-size: 15px; font-weight: 700; color: var(--text-muted); margin-bottom: 16px; display: flex; justify-content: space-between; }
    .file-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }

    .file-card {
      background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid var(--card-border);
      border-radius: 16px; padding: 16px; transition: 0.25s;
    }
    .file-card:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 10px 20px rgba(56, 189, 248, 0.2); }
    .file-thumb {
      height: 90px; border-radius: 10px; background: rgba(0, 0, 0, 0.35); display: flex;
      align-items: center; justify-content: center; font-size: 38px; color: var(--accent); margin-bottom: 10px; cursor: pointer;
    }
    .file-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
    .file-info { font-size: 11px; color: var(--text-muted); display: flex; justify-content: space-between; }

    .card-actions { display: flex; gap: 8px; margin-top: 12px; }
    .btn-action {
      flex: 1; padding: 8px; border-radius: 8px; border: none; background: #0284c7; color: #fff;
      font-size: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; text-decoration: none;
    }
    .btn-action:hover { background: #0369a1; }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(3, 7, 18, 0.85); backdrop-filter: blur(10px);
      display: none; align-items: center; justify-content: center; z-index: 100; padding: 15px;
    }
    .modal-box {
      background: #0f172a; border: 1px solid var(--card-border); border-radius: 16px;
      width: 100%; max-width: 750px; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden;
    }
    .modal-header {
      padding: 16px 20px; border-bottom: 1px solid var(--card-border); display: flex;
      justify-content: space-between; align-items: center;
    }
    .modal-body {
      padding: 20px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 250px;
    }
    .text-preview-box {
      width: 100%; max-height: 50vh; background: rgba(0,0,0,0.5); border: 1px solid var(--card-border);
      border-radius: 8px; padding: 15px; color: #e2e8f0; font-family: monospace; font-size: 13px;
      white-space: pre-wrap; overflow-y: auto; text-align: left;
    }
    .modal-footer {
      padding: 14px 20px; border-top: 1px solid var(--card-border); display: flex; justify-content: flex-end; gap: 10px;
    }
    .preview-media { max-width: 100%; max-height: 55vh; border-radius: 8px; object-fit: contain; }

    @media (max-width: 640px) {
      .header { flex-direction: column; gap: 12px; }
      .search-box { width: 100%; }
      .file-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
    }
  </style>
</head>
<body>

  <div class="glow-orb-1"></div>
  <div class="glow-orb-2"></div>
  <canvas id="particleCanvas"></canvas>

  <div class="app-container">

    <div class="header">
      <div class="brand">
        <i class="fa-solid fa-cloud"></i> My Cloud
      </div>
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass" style="color: var(--text-muted);"></i>
        <input type="text" id="searchInput" placeholder="Search files..." oninput="renderFiles()" />
      </div>
    </div>

    <div class="storage-banner">
      <div class="storage-header">
        <span><i class="fa-solid fa-hard-drive" style="color: var(--accent);"></i> Lifetime Cloud Space: 10 TB Free</span>
        <span id="storageCountText" style="color: var(--accent);">0.00 GB / 10,000 GB</span>
      </div>
      <div class="storage-bar-bg">
        <div class="storage-bar-fill" id="storageBarFill"></div>
      </div>
    </div>

    <div class="upload-zone">
      <input type="file" id="fileInput" onchange="handleFileUpload(this.files[0])" />
      <i class="fa-solid fa-cloud-arrow-up upload-icon"></i>
      <div style="font-weight: 700; font-size: 16px; margin-bottom: 5px;">Upload Any File</div>
      <div style="color: var(--text-muted); font-size: 13px;">Drag & Drop or Click to browse (High Speed, Unlimited Size)</div>

      <div class="progress-box" id="progressBox">
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressBar"></div>
        </div>
        <div class="progress-text" id="progressText">Uploading: 0%</div>
      </div>
    </div>

    <div class="notice-bar">
      <span><i class="fa-solid fa-shield-halved"></i> <strong>Lifetime Storage:</strong> File active rakhte 30 dine ontoto ekbar open ba download korun.</span>
      <button onclick="clearHistory()"><i class="fa-solid fa-trash"></i> Clear History</button>
    </div>

    <div class="section-title">
      <span>My Stored Files</span>
      <span id="fileCount" style="color: var(--accent);">0 files</span>
    </div>

    <div class="file-grid" id="filesGrid"></div>

  </div>

  <div class="modal-overlay" id="previewModal" onclick="if(event.target.id==='previewModal') closeModal()">
    <div class="modal-box">
      <div class="modal-header">
        <div id="modalFileName" style="font-weight: 600; font-size: 14px; max-width: 80%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"></div>
        <button onclick="closeModal()" style="background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 18px;"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="modal-body" id="modalPreviewBody"></div>

      <div class="modal-footer">
        <a href="#" class="btn-action" id="modalDownloadBtn">
          <i class="fa-solid fa-download"></i> Download File
        </a>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 0.5;
        this.speedX = (Math.random() - 0.5) * 0.4;
        this.speedY = (Math.random() - 0.5) * 0.4;
        this.alpha = Math.random() * 0.5 + 0.2;
      }
      update() {
        this.x += this.speedX; this.y += this.speedY;
        if (this.x < 0) this.x = canvas.width;
        if (this.x > canvas.width) this.x = 0;
        if (this.y < 0) this.y = canvas.height;
        if (this.y > canvas.height) this.y = 0;
      }
      draw() {
        ctx.fillStyle = `rgba(56, 189, 248, ${this.alpha})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    for (let i = 0; i < 40; i++) particles.push(new Particle());
    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    function getFiles() { return JSON.parse(localStorage.getItem('my_cloud_files') || '[]'); }
    function saveFiles(files) { localStorage.setItem('my_cloud_files', JSON.stringify(files)); }

    async function handleFileUpload(file) {
      if (!file) return;

      const pBox = document.getElementById('progressBox');
      const pBar = document.getElementById('progressBar');
      const pText = document.getElementById('progressText');
      const input = document.getElementById('fileInput');

      pBox.style.display = 'block';
      pBar.style.width = '0%';
      pText.innerText = 'Connecting server...';

      try {
        const sRes = await fetch('/api/server');
        const sData = await sRes.json();
        if (!sData.server) throw new Error('No server available');

        const formData = new FormData();
        formData.append('file', file);
        if (sData.token) formData.append('token', sData.token);

        const xhr = new XMLHttpRequest();
        xhr.open('POST', `https://${sData.server}.gofile.io/contents/uploadfile`);

        xhr.upload.onprogress = (e) => {
          if (e.lengthComputable) {
            const percent = Math.round((e.loaded / e.total) * 100);
            pBar.style.width = percent + '%';
            pText.innerText = `Uploading: ${percent}% (${(e.loaded / (1024 * 1024)).toFixed(1)} MB)`;
          }
        };

        xhr.onload = () => {
          if (xhr.status === 200) {
            const res = JSON.parse(xhr.responseText);
            if (res.status === 'ok') {
              pText.innerHTML = '<span style="color:#4ade80;">Upload Complete!</span>';
              setTimeout(() => { pBox.style.display = 'none'; }, 2000);

              const d = res.data;
              const files = getFiles();
              files.unshift({
                fileId: d.fileId,
                name: d.fileName || file.name,
                bytes: file.size,
                size: `${(file.size / (1024 * 1024)).toFixed(2)} MB`,
                date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
              });
              saveFiles(files);
              renderFiles();
            } else {
              pText.innerText = 'Upload failed from cloud.';
            }
          } else {
            pText.innerText = 'Upload request failed.';
          }
        };

        xhr.onerror = () => { pText.innerText = 'Network error!'; };
        xhr.send(formData);

      } catch (err) {
        pText.innerText = 'Server error.';
      } finally {
        input.value = '';
      }
    }

    function getFileIcon(name) {
      const ext = name.split('.').pop().toLowerCase();
      if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext)) return 'fa-file-image';
      if (['mp4', 'webm', 'ogg', 'mov'].includes(ext)) return 'fa-file-video';
      if (['mp3', 'wav', 'aac'].includes(ext)) return 'fa-file-audio';
      if (['zip', 'rar', '7z'].includes(ext)) return 'fa-file-zipper';
      if (['pdf'].includes(ext)) return 'fa-file-pdf';
      if (['txt', 'js', 'json', 'html', 'css', 'py'].includes(ext)) return 'fa-file-code';
      return 'fa-file-lines';
    }

    function updateStorageIndicator(files) {
      const totalBytes = files.reduce((acc, f) => acc + (f.bytes || 0), 0);
      const usedGB = (totalBytes / (1024 * 1024 * 1024)).toFixed(2);
      document.getElementById('storageCountText').innerText = `${usedGB} GB / 10,000 GB`;
      const percent = Math.min(100, Math.max(0.1, (usedGB / 10000) * 100));
      document.getElementById('storageBarFill').style.width = percent + '%';
    }

    function renderFiles() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const allFiles = getFiles();
      updateStorageIndicator(allFiles);

      const files = allFiles.filter(f => f.name.toLowerCase().includes(q));
      const grid = document.getElementById('filesGrid');
      document.getElementById('fileCount').innerText = `${files.length} files`;

      grid.innerHTML = '';
      if (!files.length) {
        grid.innerHTML = '<p style="color:var(--text-muted); grid-column:1/-1; text-align:center; padding:30px;">কোনো ফাইল পাওয়া যায়নি। ওপরের বক্সে আপলোড করুন।</p>';
        return;
      }

      files.forEach((f, idx) => {
        const downloadUrl = `/api/download?fileId=${f.fileId}&fileName=${encodeURIComponent(f.name)}`;
        const card = document.createElement('div');
        card.className = 'file-card';
        card.innerHTML = `
          <div class="file-thumb" onclick="openPreview(${idx})"><i class="fa-solid ${getFileIcon(f.name)}"></i></div>
          <div class="file-name" title="${f.name}">${f.name}</div>
          <div class="file-info">
            <span>${f.size}</span>
            <span>${f.date}</span>
          </div>
          <div class="card-actions">
            <button class="btn-action" onclick="openPreview(${idx})"><i class="fa-solid fa-eye"></i> View</button>
            <a href="${downloadUrl}" class="btn-action" title="Download"><i class="fa-solid fa-download"></i></a>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    async function openPreview(index) {
      const file = getFiles()[index];
      if (!file) return;

      document.getElementById('modalFileName').innerText = file.name;
      const downloadUrl = `/api/download?fileId=${file.fileId}&fileName=${encodeURIComponent(file.name)}`;
      document.getElementById('modalDownloadBtn').href = downloadUrl;

      const ext = file.name.split('.').pop().toLowerCase();
      const body = document.getElementById('modalPreviewBody');
      body.innerHTML = '<div style="color:var(--text-muted);"><i class="fa-solid fa-spinner fa-spin"></i> ফাইল লোড হচ্ছে...</div>';
      document.getElementById('previewModal').style.display = 'flex';

      try {
        if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext)) {
          body.innerHTML = `<img src="${downloadUrl}" class="preview-media" alt="${file.name}" />`;
        } else if (['mp4', 'webm'].includes(ext)) {
          body.innerHTML = `<video controls autoplay class="preview-media" src="${downloadUrl}"></video>`;
        } else if (['mp3', 'wav'].includes(ext)) {
          body.innerHTML = `<audio controls autoplay style="width: 100%;" src="${downloadUrl}"></audio>`;
        } else if (ext === 'pdf') {
          body.innerHTML = `<iframe src="${downloadUrl}" style="width:100%; height:55vh; border:none; border-radius:8px;"></iframe>`;
        } else if (['txt', 'js', 'json', 'html', 'css', 'py'].includes(ext)) {
          const res = await fetch(downloadUrl);
          const text = await res.text();
          body.innerHTML = `<pre class="text-preview-box">${escapeHtml(text)}</pre>`;
        } else {
          fallbackPreview(file.name);
        }
      } catch (e) {
        fallbackPreview(file.name);
      }
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function fallbackPreview(fileName) {
      const body = document.getElementById('modalPreviewBody');
      body.innerHTML = `
        <div style="text-align: center; padding: 25px;">
          <i class="fa-solid ${getFileIcon(fileName)}" style="font-size: 55px; color: var(--accent); margin-bottom: 12px;"></i>
          <p style="color: var(--text-muted); font-size: 13px;">ফাইলটির ইন-সাইট প্রিভিউ সরাসরি দেখার মতো নয়। নিচের বাটনে চাপ দিয়ে ডাউনলোড করে নিন।</p>
        </div>
      `;
    }

    function closeModal() {
      const body = document.getElementById('modalPreviewBody');
      body.innerHTML = '';
      document.getElementById('previewModal').style.display = 'none';
    }

    function clearHistory() {
      if (confirm('হিস্ট্রি মুছে ফেলতে চান?')) {
        localStorage.removeItem('my_cloud_files');
        renderFiles();
      }
    }

    renderFiles();
  </script>
</body>
</html>
