<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ক্লাউড স্টোরেজ</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; margin: 0; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #1e293b; border: 1px solid #334155; padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); width: 100%; max-width: 520px; text-align: center; }
    h2 { margin-top: 0; color: #38bdf8; font-size: 22px; }
    input[type="file"] { margin: 20px 0; width: 100%; color: #94a3b8; }
    button, .btn { background: #0284c7; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: 600; text-decoration: none; display: inline-block; }
    button:hover, .btn:hover { background: #0369a1; }
    #status { margin-top: 20px; font-size: 14px; text-align: left; }
    
    /* প্রিভিউ উইন্ডো */
    .preview-box { margin-top: 20px; background: #0b0f19; border: 1px solid #334155; border-radius: 8px; padding: 15px; min-height: 250px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .preview-box img, .preview-box video { max-width: 100%; max-height: 380px; border-radius: 6px; }
    .preview-box iframe { width: 100%; height: 380px; border: none; background: white; border-radius: 6px; }
  </style>
</head>
<body>

  <!-- ১. আপলোড ভিউ (মূল পেজে কেউ ফাইল লিস্ট দেখতে পাবে না) -->
  <div class="card" id="uploadCard">
    <h2>📦 ক্লাউড স্টোরেজ</h2>
    <p style="color:#94a3b8; font-size: 13px;">ফাইল আপলোড করুন এবং নিরাপদ শেয়ার লিংক তৈরি করুন।</p>
    <input type="file" id="fileInput" />
    <button id="uploadBtn" onclick="upload()">আপলোড করুন</button>
    <div id="status"></div>
  </div>

  <!-- ২. গুগল ড্রাইভ প্রিভিউ ভিউ (শুধুমাত্র ফাইলের লিংকে ঢুকলে দেখাবে) -->
  <div class="card" id="previewCard" style="display: none;">
    <h3 id="prevFileName" style="color: #38bdf8; margin-bottom: 15px; word-break: break-all; font-size: 16px;"></h3>
    <div class="preview-box" id="mediaArea">
      <p style="color:#888;">প্রিভিউ লোড হচ্ছে...</p>
    </div>
    <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: center;">
      <a id="downloadBtn" class="btn" href="#" target="_blank" download>⬇ ডাউনলোড</a>
      <a href="/" class="btn" style="background: #475569;">নতুন আপলোড</a>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const fileId = urlParams.get('file');
    const fileName = urlParams.get('name') || 'File';

    // লিংকে file parameter থাকলে শুধু প্রিভিউ দেখাবে
    if (fileId) {
      document.getElementById('uploadCard').style.display = 'none';
      document.getElementById('previewCard').style.display = 'block';
      document.getElementById('prevFileName').innerText = fileName;

      fetch(`/api/file-url?id=${fileId}`)
        .then(res => res.json())
        .then(data => {
          if (!data.url) throw new Error('Not found');
          const fileSrc = data.url;
          const mediaArea = document.getElementById('mediaArea');
          document.getElementById('downloadBtn').href = fileSrc;

          const ext = fileName.split('.').pop().toLowerCase();

          if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext)) {
            mediaArea.innerHTML = `<img src="${fileSrc}" alt="Preview" />`;
          } else if (['mp4', 'webm'].includes(ext)) {
            mediaArea.innerHTML = `<video src="${fileSrc}" controls></video>`;
          } else if (['mp3', 'wav', 'ogg'].includes(ext)) {
            mediaArea.innerHTML = `<audio src="${fileSrc}" controls style="width:100%;"></audio>`;
          } else if (['pdf', 'txt', 'html'].includes(ext)) {
            mediaArea.innerHTML = `<iframe src="${fileSrc}"></iframe>`;
          } else {
            mediaArea.innerHTML = `<div style="padding: 20px; color: #94a3b8;">📄 প্রিভিউ উপলভ্য নয়। নিচের বাটনে ক্লিক করে ডাউনলোড করুন।</div>`;
          }
        })
        .catch(() => {
          document.getElementById('mediaArea').innerHTML = `<p style="color:#ef4444;">ফাইলটি পাওয়া যায়নি বা এক্সপায়ার হয়ে গেছে।</p>`;
        });
    }

    async function upload() {
      const input = document.getElementById('fileInput');
      const status = document.getElementById('status');
      const btn = document.getElementById('uploadBtn');

      if (!input.files[0]) {
        status.innerHTML = '<span style="color: #ef4444;">দয়া করে একটি ফাইল বেছে নিন!</span>';
        return;
      }

      btn.disabled = true;
      btn.innerText = 'আপলোড হচ্ছে...';
      status.innerHTML = '<span style="color: #38bdf8;">ফাইল সেভ হচ্ছে...</span>';

      const formData = new FormData();
      formData.append('userFile', input.files[0]);

      try {
        const res = await fetch('/api/upload', { method: 'POST', body: formData });
        const data = await res.json();

        if (res.ok) {
          status.innerHTML = `
            <div style="background:#0b0f19; padding:12px; border-radius:6px; border:1px solid #334155; margin-top:10px;">
              <span style="color: #22c55e;">✔ আপলোড সম্পন্ন!</span><br>
              <span style="color:#cbd5e1; font-size:13px;">ফাইল: ${data.name} (${data.size})</span><br><br>
              🔗 <b>প্রিভিউ লিংক:</b><br>
              <a href="${data.link}" target="_blank" style="color:#38bdf8; word-break:break-all; text-decoration:underline;">${window.location.origin}${data.link}</a>
            </div>
          `;
        } else {
          status.innerHTML = `<span style="color: #ef4444;">${data.error}</span>`;
        }
      } catch (err) {
        status.innerHTML = '<span style="color: #ef4444;">সার্ভারে সমস্যা দেখা দিয়েছে!</span>';
      } finally {
        btn.disabled = false;
        btn.innerText = 'আপলোড করুন';
      }
    }
  </script>
</body>
</html>
