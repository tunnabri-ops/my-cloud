<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Drive</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-main: #0b1329;
      --bg-sidebar: #0f172a;
      --bg-card: #141e33;
      --bg-hover: #1e293b;
      --border: #1e293b;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

    .sidebar { width: 260px; background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px; }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 19px; font-weight: 700; color: #38bdf8; margin-bottom: 25px; }
    
    .upload-btn-container { position: relative; margin-bottom: 25px; }
    .upload-btn { background: var(--accent); color: white; border: none; padding: 12px 20px; border-radius: 25px; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4); transition: 0.2s; }
    .upload-btn:hover { background: var(--accent-hover); }
    .upload-btn-container input[type="file"] { position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }

    .menu-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 8px; color: var(--text-muted); cursor: pointer; margin-bottom: 5px; font-size: 14px; }
    .menu-item.active, .menu-item:hover { background: var(--bg-hover); color: var(--text-main); }
    
    .storage-info { margin-top: auto; padding: 15px; background: rgba(0,0,0,0.25); border-radius: 8px; font-size: 12px; color: var(--text-muted); }
    .storage-bar { height: 6px; background: #1e293b; border-radius: 4px; margin-top: 8px; overflow: hidden; }
    .storage-fill { width: 100%; height: 100%; background: #38bdf8; }

    .main-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .top-header { padding: 16px 25px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .search-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 8px 16px; display: flex; align-items: center; gap: 10px; width: 320px; }
    .search-box input { background: transparent; border: none; color: white; outline: none; width: 100%; font-size: 13px; }

    .content-body { flex: 1; padding: 25px; overflow-y: auto; }
    .section-title { font-size: 15px; font-weight: 600; color: var(--text-muted); margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }

    .file-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 18px; }
    .file-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; cursor: pointer; transition: 0.2s; position: relative; user-select: none; }
    .file-card:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
    .file-thumbnail { height: 110px; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.25); border-radius: 6px; margin-bottom: 12px; font-size: 44px; color: #38bdf8; }
    .file-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-meta { font-size: 11px; color: var(--text-muted); margin-top: 6px; display: flex; justify-content: space-between; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 100; }
    .modal-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; width: 90%; max-width: 820px; height: 85vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.7); }
    .modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: #0f172a; }
    .modal-body { flex: 1; padding: 20px; display: flex; align-items: center; justify-content: center; overflow: auto; background: #070d1e; }
    .modal-body img, .modal-body video { max-width: 100%; max-height: 100%; border-radius: 6px; }
    .modal-body iframe { width: 100%; height: 100%; border: none; background: white; border-radius: 6px; }
    .btn-action { background: var(--accent); color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; border: none; cursor: pointer; }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="brand">
      <i class="fa-solid fa-cloud"></i> Cloud Drive
    </div>
    
    <div class="upload-btn-container">
      <button class="upload-btn" id="uploadBtn">
        <i class="fa-solid fa-plus"></i> Upload File
      </button>
      <input type="file" id="fileInput" onchange="uploadFile()" />
    </div>

    <div class="menu-item active">
      <i class="fa-solid fa-folder-open"></i> My Files
    </div>
    <div class="menu-item" onclick="clearMyFiles()">
      <i class="fa-solid fa-trash"></i> Clear History
    </div>

    <div class="storage-info">
      <div id="storageText">Storage: Unlimited (Gofile Cloud)</div>
      <div class="storage-bar"><div class="storage-fill"></div></div>
      <div style="margin-top: 5px; font-size: 11px;">Active Cloud Provider</div>
    </div>
  </div>

  <div class="main-area">
    <div class="top-header">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass" style="color: var(--text-muted);"></i>
        <input type="text" id="searchInput" placeholder="Search files..." oninput="renderFiles()" />
      </div>
      <div id="uploadStatusText" style="font-size: 13px; color: #38bdf8;"></div>
    </div>

    <div class="content-body">
      <div class="section-title">
        <span>Files in this Browser</span>
        <span id="fileCount" style="font-size: 12px;">0 files</span>
      </div>

      <div class="file-grid" id="filesGrid"></div>
    </div>
  </div>

  <!-- Preview Modal -->
  <div class="modal-overlay" id="previewModal" onclick="checkClose(event)">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div style="font-size: 14px; font-weight: 600; max-width: 450px; overflow: hidden; text-overflow: ellipsis;" id="modalFileName">File Preview</div>
        <div style="display: flex; gap: 10px; align-items: center;">
          <a href="#" id="modalDownload" class="btn-action" target="_blank" rel="noopener noreferrer">
            <i class="fa-solid fa-download"></i> Download
          </a>
          <button class="btn-action" style="background:#475569;" onclick="closeModal()">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
      </div>
      <div class="modal-body" id="modalContent"></div>
    </div>
  </div>

  <script>
    function getStoredFiles() {
      return JSON.parse(localStorage.getItem('my_drive_files') || '[]');
    }

    function saveStoredFiles(files) {
      localStorage.setItem('my_drive_files', JSON.stringify(files));
    }

    async function uploadFile() {
      const input = document.getElementById('fileInput');
      const statusText = document.getElementById('uploadStatusText');

      if (!input.files[0]) return;
      const file = input.files[0];

      statusText.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Uploading to Gofile...';

      const formData = new FormData();
      formData.append('userFile', file);

      try {
        const res = await fetch('/api/upload', { method: 'POST', body: formData });
        const data = await res.json();

        if (res.ok) {
          statusText.innerHTML = '<span style="color:#22c55e;"><i class="fa-solid fa-check"></i> Upload Completed!</span>';
          setTimeout(() => { statusText.innerText = ''; }, 3000);

          const files = getStoredFiles();
          files.unshift({
            id: data.fileId,
            name: data.name,
            size: data.size,
            link: data.link,
            downloadPage: data.downloadPage,
            date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
          });
          saveStoredFiles(files);
          renderFiles();
        } else {
          statusText.innerHTML = '<span style="color:#ef4444;">Upload Failed!</span>';
        }
      } catch (err) {
        statusText.innerHTML = '<span style="color:#ef4444;">Server Error!</span>';
      } finally {
        input.value = '';
      }
    }

    function getIcon(name) {
      const ext = name.split('.').pop().toLowerCase();
      if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext)) return 'fa-file-image';
      if (['mp4', 'webm', 'mkv'].includes(ext)) return 'fa-file-video';
      if (['mp3', 'wav'].includes(ext)) return 'fa-file-audio';
      if (ext === 'pdf') return 'fa-file-pdf';
      if (['txt', 'log', 'html', 'js', 'json'].includes(ext)) return 'fa-file-lines';
      if (['zip', 'rar', '7z'].includes(ext)) return 'fa-file-zipper';
      return 'fa-file';
    }

    function renderFiles() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const files = getStoredFiles().filter(f => f.name.toLowerCase().includes(query));
      const grid = document.getElementById('filesGrid');
      const count = document.getElementById('fileCount');

      count.innerText = `${files.length} file${files.length === 1 ? '' : 's'}`;
      grid.innerHTML = '';

      if (!files.length) {
        grid.innerHTML = '<p style="color:var(--text-muted); grid-column: 1/-1;">No files found. Click "+ Upload File" to start uploading.</p>';
        return;
      }

      files.forEach((file) => {
        const card = document.createElement('div');
        card.className = 'file-card';
        card.onclick = () => openPreview(file);
        card.innerHTML = `
          <div class="file-thumbnail">
            <i class="fa-solid ${getIcon(file.name)}"></i>
          </div>
          <div class="file-title" title="${file.name}">${file.name}</div>
          <div class="file-meta">
            <span>${file.size}</span>
            <span>${file.date}</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openPreview(file) {
      const modal = document.getElementById('previewModal');
      const modalName = document.getElementById('modalFileName');
      const modalContent = document.getElementById('modalContent');
      const modalDownload = document.getElementById('modalDownload');

      modalName.innerText = file.name;
      modalDownload.href = file.downloadPage || file.link;
      modal.style.display = 'flex';

      const ext = file.name.split('.').pop().toLowerCase();

      if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext)) {
        modalContent.innerHTML = `<img src="${file.link}" alt="Preview" />`;
      } else if (['mp4', 'webm'].includes(ext)) {
        modalContent.innerHTML = `<video src="${file.link}" controls autoplay></video>`;
      } else if (['mp3', 'wav'].includes(ext)) {
        modalContent.innerHTML = `<audio src="${file.link}" controls autoplay style="width:80%;"></audio>`;
      } else {
        modalContent.innerHTML = `
          <div style="text-align:center; color:var(--text-muted);">
            <i class="fa-solid ${getIcon(file.name)}" style="font-size:45px; margin-bottom:12px; color:#38bdf8;"></i>
            <br>Click below to open or download this file via Gofile.
            <br><br>
            <a href="${file.downloadPage || file.link}" target="_blank" class="btn-action">
              <i class="fa-solid fa-arrow-up-right-from-square"></i> Open File
            </a>
          </div>
        `;
      }
    }

    function closeModal() {
      document.getElementById('previewModal').style.display = 'none';
      document.getElementById('modalContent').innerHTML = '';
    }

    function checkClose(event) {
      if (event.target.id === 'previewModal') closeModal();
    }

    function clearMyFiles() {
      if (confirm('Clear local browser file history?')) {
        localStorage.removeItem('my_drive_files');
        renderFiles();
      }
    }

    renderFiles();
  </script>
</body>
</html>
